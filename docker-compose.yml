services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    image: node:24-bookworm
    working_dir: /workspace
    command: >
      sh -c "npm install &&
      npm run start:dev -w apps/api"
    env_file:
      - .env
    volumes:
      - .:/workspace
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    image: node:24-bookworm
    working_dir: /workspace
    command: >
      sh -c "npm install &&
      npm run dev -w apps/web -- --host 0.0.0.0"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://api:3001
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
